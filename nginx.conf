server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Health endpoint used by Docker and Coolify.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints files in /assets, so they can be cached forever.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Bundled Nifty snapshot: short cache so refreshed data shows up quickly.
    location /data/ {
        expires 1h;
        try_files $uri =404;
    }

    # index.html must revalidate so a new deploy is picked up immediately.
    location = /index.html {
        expires -1;
    }

    # Client-side routing fallback (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

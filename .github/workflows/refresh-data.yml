name: Refresh market data

on:
  schedule:
    # 02:15 UTC (07:45 IST) every day
    - cron: "15 2 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Nifty first: the fund snapshot uses its coverage window.
      # If both external sources are rate-limiting, the existing snapshot is kept.
      - name: Refresh Nifty 50 snapshot
        run: npm run update:nifty
        continue-on-error: true

      - name: Refresh fund NAV snapshot
        run: npm run update:funds

      - name: Verify boundary logic
        run: npm run check:returns

      - name: Verify tools and agent loop
        run: npm run check:tools && npm run check:agent && npm run check:provider

      - name: Verify the app still builds
        run: npm run build

      - name: Verify the API and static server
        run: npm run check:api

      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nifty50.json public/data/funds.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh bundled market data"
            git push
          fi
